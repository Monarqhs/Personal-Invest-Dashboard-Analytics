services:
  - type: web
    name: dashboard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: AUTH_ENFORCEMENT_ENABLED
        value: "false"
      - key: RLS_ENABLED
        value: "false"
      - key: NOTIFIER_TYPE
        fromDatabase:
          name: dashboard-api-env
          property: NOTIFIER_TYPE
      - key: DATABASE_URL
        fromDatabase:
          name: dashboard-db
          property: connectionString
      - key: DATABASE_POOL_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /health
    autoDeploy: true
