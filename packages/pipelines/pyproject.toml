[project]
name = "dashboard-pipelines"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dashboard-shared",
    "yfinance>=0.2.44",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "boto3>=1.35.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
