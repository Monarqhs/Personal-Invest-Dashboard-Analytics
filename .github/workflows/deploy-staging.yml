name: Deploy — Staging

# Triggered by merge into uat. Deploys API to Render staging service
# and triggers Vercel preview deployment for the web app.
on:
  push:
    branches: [uat]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  deploy-api-staging:
    name: Deploy API → Render (staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}" ]; then
            echo "::warning::RENDER_STAGING_DEPLOY_HOOK secret not set — skipping API deploy"
            exit 0
          fi
          STATUS=$(curl -s -o /tmp/render_resp.json -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}")
          cat /tmp/render_resp.json
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "::error::Render deploy hook returned HTTP $STATUS"
            exit 1
          fi
          echo "Render staging deploy triggered successfully"

  deploy-web-staging:
    name: Deploy Web → Vercel (preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Deploy to Vercel preview
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not set — skipping web deploy"
            exit 0
          fi
          vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
          vercel build --token=$VERCEL_TOKEN
          DEPLOY_URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)
          echo "Staging preview deployed: $DEPLOY_URL"
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_STEP_SUMMARY

  smoke-test-staging:
    name: Smoke test staging API
    runs-on: ubuntu-latest
    needs: [deploy-api-staging]
    steps:
      - name: Wait for Render deploy to become live
        run: sleep 30

      - name: Health check
        run: |
          if [ -z "${{ secrets.RENDER_STAGING_URL }}" ]; then
            echo "::warning::RENDER_STAGING_URL not set — skipping smoke test"
            exit 0
          fi
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ secrets.RENDER_STAGING_URL }}/health" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Staging API healthy"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Staging health check failed after 6 attempts"
          exit 1
