services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dashboard_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dashboard_dev
      DATABASE_POOL_URL: postgresql://postgres:postgres@postgres:5432/dashboard_dev
      AUTH_ENFORCEMENT_ENABLED: "false"
      RLS_ENABLED: "false"
      NOTIFIER_TYPE: noop
      CACHE_PROVIDER: inmemory
      LOG_LEVEL: INFO
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - ./packages/shared/python:/packages/shared/python
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app
        - action: sync
          path: ./packages/shared/python
          target: /packages/shared/python

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app
          ignore:
            - node_modules
            - .next

volumes:
  postgres_data:
